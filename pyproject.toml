[project]
name = "spartanseats"
version = "0.1.0"
description = "Predict when SJSU class sections fill, from public schedule snapshots"
requires-python = ">=3.11"
dependencies = ["requests", "beautifulsoup4", "pandas", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spartanseats"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
