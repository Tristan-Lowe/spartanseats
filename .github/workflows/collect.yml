name: collect

# Snapshot open seats on SJSU's public class schedule every 4 hours, for every term
# whose registration window is open, and commit the result as a small CSV.
# Runs without a laptop, so collection continues while traveling.
# GitHub may delay scheduled runs by several minutes; the timestamp in each file is the real one.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Same Python and package versions that trained model/landmark.joblib.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Install dependencies
        run: pip install -r requirements-live.txt

      - name: Snapshot open terms
        run: python -m spartanseats.fetch live --csv

      - name: Build predictions
        # The site keeps the last good data if this fails, so a model problem never blocks collection.
        continue-on-error: true
        run: python -m spartanseats.live predict

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          retention-days: 3

      - name: Commit snapshots
        run: |
          git config user.name "spartanseats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
